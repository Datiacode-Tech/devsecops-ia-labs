# Unidad 7 · Ejemplo 4: pipeline DevSecOps con tres controles.
# Sustituye a los ejemplos 1 a 3: cópialo en .github/workflows/ de TU repositorio
# y borra de allí los anteriores para no ejecutar los controles dos veces.
name: "U7 · 4 · DevSecOps"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

# Los tres jobs se ejecutan en paralelo y de forma independiente:
# el workflow solo termina bien si los tres terminan bien.
jobs:
  pruebas:
    name: Pruebas con pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider -rs tests

  secretos:
    name: Secretos con Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS" git /repo --redact --no-banner -v

  dependencias:
    name: Dependencias con Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/requirements-instalados.txt
      - run: >-
          docker run --rm
          -v "$PWD/artifacts/requirements-instalados.txt:/src/requirements.txt:ro"
          "$TRIVY" fs --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src
