# Unidad 7 · Ejemplo 1: primer pipeline CI (pruebas con pytest).
# Para activarlo, cópialo en .github/workflows/ de TU repositorio de prácticas.
name: "U7 · 1 · Pruebas"

# Eventos: cuándo se ejecuta el workflow.
on:
  push:
    branches: [main]        # al integrar cambios en main
  pull_request:             # al abrir o actualizar una Pull Request
  workflow_dispatch:        # a mano, desde la pestaña Actions

# Permisos mínimos del GITHUB_TOKEN: solo leer el código.
permissions:
  contents: read

jobs:
  pruebas:                  # un job: una máquina virtual nueva que ejecuta sus steps en orden
    name: Pruebas con pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar las dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar las pruebas
        run: python -m pytest -q -p no:cacheprovider -rs tests
