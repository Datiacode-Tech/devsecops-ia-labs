# Ejemplo 4 (Unidad 4): Docker Compose Secrets frente a variables de entorno.
# Proyecto independiente del laboratorio principal: nombre propio y puertos 8007 y 8008,
# publicados solo en 127.0.0.1. No usa .env ni el socket de Docker.
name: devsecops-ia-u04-secretos

services:
  # Opción B: la clave llega como fichero en /run/secrets/demo_api_key.
  api-secreto:
    build: .
    image: devsecops-ia-u04-secretos:local
    ports:
      - "127.0.0.1:8007:8000"
    secrets:
      - demo_api_key
    # Sin bloque environment: la clave no se convierte en variable de entorno.

  # Opción A, solo para comparar (perfil "comparar"): la misma clave como variable de entorno.
  api-entorno:
    profiles: [comparar]
    build: .
    image: devsecops-ia-u04-secretos:local
    ports:
      - "127.0.0.1:8008:8000"
    env_file:
      - path: ./secrets/demo.env
        required: true

secrets:
  demo_api_key:
    # Docker Compose monta este fichero del equipo en el contenedor. No lo cifra:
    # su protección depende de los permisos del fichero y de quién accede al equipo.
    file: ./secrets/demo_api_key.txt
