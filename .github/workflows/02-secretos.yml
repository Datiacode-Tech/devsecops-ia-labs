# Unidad 7 · Ejemplo 2: detección de secretos con Gitleaks.
# Para activarlo, cópialo en .github/workflows/ de TU repositorio de prácticas.
name: "U7 · 2 · Secretos"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # La misma versión que en las unidades 4 y 6, fijada por número y por digest.
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  secretos:
    name: Secretos con Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # sin esto solo se descarga el último commit
          persist-credentials: false

      - name: Buscar secretos en todo el historial
        # Si encuentra un secreto, Gitleaks termina con código 1 y el job falla.
        # --redact oculta el valor del secreto en el log.
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS" git /repo --redact --no-banner -v
